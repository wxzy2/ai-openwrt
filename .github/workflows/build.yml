name: Build ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      target:
        description: '选择编译机型'
        required: true
        type: choice
        options:
          - 360v6
          - ax6600
          - all

env:
  REPO_URL:    https://github.com/VIKINGYFY/immortalwrt
  REPO_BRANCH: main
  TZ:          Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        device: ${{ inputs.target == 'all'
          && fromJson('["360v6","ax6600"]')
          || fromJson(format('["{0}"]', inputs.target)) }}

    steps:
      - name: 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with: { tool-cache: false, large-packages: true }

      - name: 初始化环境
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext \
            git libncurses-dev libssl-dev python3-dev \
            rsync unzip zlib1g-dev wget ccache
          sudo timedatectl set-timezone "$TZ"

      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 克隆源码
        run: |
          git clone --depth=1 -b $REPO_BRANCH $REPO_URL openwrt

      - name: 缓存编译工具链
        uses: actions/cache@v4
        with:
          path: |
            openwrt/.ccache
            openwrt/staging_dir/host
            openwrt/staging_dir/toolchain-*
            openwrt/build_dir/host
          key: ${{ matrix.device }}-toolchain-${{ hashFiles(format('configs/{0}.config', matrix.device)) }}
          restore-keys: |
            ${{ matrix.device }}-toolchain-

      - name: 启用 ccache 加速
        run: |
          cd openwrt
          echo 'CONFIG_CCACHE=y' >> .config
          echo 'CONFIG_CCACHE_DIR=openwrt/.ccache' >> .config

      - name: DIY 第一阶段 (feeds 前)
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/scripts/diy.sh pre ${{ matrix.device }}

      - name: 更新安装 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: DIY 第二阶段 (feeds 后)
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/scripts/diy.sh post ${{ matrix.device }}

      - name: 加载 .config
        run: |
          cp configs/${{ matrix.device }}.config openwrt/.config
          cd openwrt && make defconfig

      - name: 下载依赖包
        run: |
          cd openwrt
          make download -j$(nproc) 2>&1 | grep -i error || true

      - name: 编译固件
        id: compile
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-build-logs
          path: openwrt/logs/
          retention-days: 3

      - name: 整理固件文件
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV
          # 把完整展开的 .config 复制到固件目录一起上传
          cp $GITHUB_WORKSPACE/openwrt/.config $PWD/full.config

      - name: 获取编译时间
        if: steps.compile.outputs.status == 'success'
        id: time
        run: echo "date=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: 生成插件清单
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt
          echo "# 固件包含的插件列表" > $GITHUB_WORKSPACE/PLUGINS.md
          echo "" >> $GITHUB_WORKSPACE/PLUGINS.md
          echo "**编译时间**: ${{ steps.time.outputs.date }}" >> $GITHUB_WORKSPACE/PLUGINS.md
          echo "**编译机型**: ${{ matrix.device }}" >> $GITHUB_WORKSPACE/PLUGINS.md
          echo "**内核版本**: $(cat .config | grep CONFIG_LINUX_VERSION | cut -d'=' -f2)" >> $GITHUB_WORKSPACE/PLUGINS.md
          echo "" >> $GITHUB_WORKSPACE/PLUGINS.md
          echo "## 已安装插件" >> $GITHUB_WORKSPACE/PLUGINS.md
          echo "" >> $GITHUB_WORKSPACE/PLUGINS.md
          
          # 提取所有被选中的 luci-app 和主要包
          grep "^CONFIG_PACKAGE_" .config | grep "=y" | sed 's/CONFIG_PACKAGE_//g' | sed 's/=y//g' | sort | while read pkg; do
            case "$pkg" in
              luci-app-*) echo "- $pkg" >> $GITHUB_WORKSPACE/PLUGINS.md ;;
              luci-theme-*) echo "- $pkg (主题)" >> $GITHUB_WORKSPACE/PLUGINS.md ;;
              aria2|openlist2|ddns-go|homeproxy|openclash) echo "- $pkg" >> $GITHUB_WORKSPACE/PLUGINS.md ;;
            esac
          done
          
          echo "" >> $GITHUB_WORKSPACE/PLUGINS.md
          echo "---" >> $GITHUB_WORKSPACE/PLUGINS.md
          echo "生成时间: $(date)" >> $GITHUB_WORKSPACE/PLUGINS.md
          
          cat $GITHUB_WORKSPACE/PLUGINS.md

      - name: 检查固件文件
        if: steps.compile.outputs.status == 'success'
        run: |
          ls -lh ${{ env.FIRMWARE }}/
          echo "固件路径: ${{ env.FIRMWARE }}"
          echo "固件文件数: $(ls ${{ env.FIRMWARE }}/* 2>/dev/null | wc -l)"

      - name: 发布 Release
        if: steps.compile.outputs.status == 'success'
        uses: ncipollo/release-action@v1
        with:
          tag:       ${{ matrix.device }}-${{ steps.time.outputs.date }}
          name:      ${{ matrix.device }} ${{ steps.time.outputs.date }}
          artifacts: ${{ env.FIRMWARE }}/*
          bodyFile:  ${{ github.workspace }}/PLUGINS.md
          token:     ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          makeLatest: false

      - name: 清理旧 Release（每个机型保留最新 20 个）
        if: steps.compile.outputs.status == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const device = "${{ matrix.device }}";
            const keep   = 20;

            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            const mine = releases
              .filter(r => r.tag_name.startsWith(device + "-"))
              .sort((a, b) => new Date(b.published_at) - new Date(a.published_at));

            const toDelete = mine.slice(keep);
            for (const r of toDelete) {
              console.log(`删除: ${r.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                release_id: r.id
              });
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo:  context.repo.repo,
                ref:   `tags/${r.tag_name}`
              });
            }
