name: Manual Clean GitHub Actions Cache

on:
  workflow_dispatch: # 允许在 Actions 页面手动点击触发

permissions:
  actions: write # 关键：必须赋予写入/删除缓存的权限

jobs:
  clear-cache:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Clean Cache via GitHub CLI
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # 使用内置的 Token 认证
      run: |
        echo "==== 开始查询当前仓库的缓存列表 ===="
        
        # 获取缓存列表并提取所有的 Cache Key
        gh cache list --limit 100
        
        # 提取所有的 Cache Key 放入数组
        cacheKeys=$(gh cache list --limit 100 | cut -f 1)
        
        if [ -z "$cacheKeys" ]; then
          echo "🎉 报告！当前仓库没有任何缓存，无需清理。"
          exit 0
        fi
        
        echo "发现以下缓存，正在准备批量清理..."
        
        # 循环遍历并强行删除
        for cacheKey in $cacheKeys; do
          echo "正在删除缓存: $cacheKey"
          gh cache delete "$cacheKey" || true
        done
        
        echo "==== ✨ 所有缓存清理完毕！ ===="
