name: Build Core (Reusable)

on:
  workflow_call:
    inputs:
      name:        { type: string, required: true }
      repo_url:    { type: string, required: true }
      repo_branch: { type: string, default: main }
      config_file: { type: string, required: true }
      diy_script:  { type: string, default: scripts/diy-default.sh }

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:

      - name: ☁️ 释放磁盘空间
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: 🔧 初始化环境
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gettext \
            git libncurses-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget
          sudo timedatectl set-timezone "$TZ"

      - name: 📦 检出当前仓库
        uses: actions/checkout@v4

      - name: 📥 克隆源码
        run: |
          git clone --depth=1 -b ${{ inputs.repo_branch }} \
            ${{ inputs.repo_url }} openwrt
          echo "OPENWRT_PATH=$GITHUB_WORKSPACE/openwrt" >> $GITHUB_ENV

      - name: 🔌 运行 DIY 脚本 (feeds 前)
        run: |
          chmod +x ${{ inputs.diy_script }} scripts/common.sh
          cd openwrt
          bash $GITHUB_WORKSPACE/${{ inputs.diy_script }} pre

      - name: 📋 更新并安装 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 🔌 运行 DIY 脚本 (feeds 后)
        run: |
          cd openwrt
          bash $GITHUB_WORKSPACE/${{ inputs.diy_script }} post

      - name: ⚙️ 加载配置文件
        run: |
          cp $GITHUB_WORKSPACE/${{ inputs.config_file }} openwrt/.config
          cd openwrt && make defconfig

      - name: 🚀 下载编译依赖
        run: |
          cd openwrt
          make download -j$(nproc) 2>&1 | grep -i error || true

      - name: 🔨 编译固件
        id: compile
        run: |
          cd openwrt
          echo "开始编译，线程数: $(nproc)"
          make -j$(nproc) || make -j1 V=s  # 失败自动降级单线程
          echo "status=success" >> $GITHUB_OUTPUT

      - name: 📤 整理固件
        if: steps.compile.outputs.status == 'success'
        run: |
          cd openwrt/bin/targets/*/*
          rm -rf packages
          echo "FIRMWARE=$PWD" >> $GITHUB_ENV

      - name: 🗜️ 上传 Release
        if: steps.compile.outputs.status == 'success'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.name }}-${{ github.run_number }}
          name: 🚀 ${{ inputs.name }} Build ${{ github.run_number }}
          artifacts: ${{ env.FIRMWARE }}/*
          token: ${{ secrets.GITHUB_TOKEN }}
